<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Analizador de Ahorros</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        
        /* Layout de Gráficos */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .chart-container { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        /* Grid de Tarjetas (Manteniendo lo anterior) */
        .jars-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .jar-card { background: white; padding: 15px; border-radius: 10px; border-left: 5px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.8s ease; }
        
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1>Visualizador MySavings</h1>
    <button class="logout-btn" id="btnLogout">Cerrar Sesión</button>
</div>

<div class="charts-grid">
    <div class="chart-container">
        <h2>Distribución de Fondos</h2>
        <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-container">
        <h2>Progreso vs Meta ($)</h2>
        <canvas id="barChart"></canvas>
    </div>
</div>

<h2>Mis Frascos Detallados</h2>
<div class="jars-grid" id="jarsContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Configuración Firebase (la misma que ya tienes)
    const firebaseConfig = {
        apiKey: "AIzaSyAjvE0dar7x1bnj8xjy8KTgXwCFLVfUJ7Q",
        authDomain: "mysavings-fcf4e.firebaseapp.com",
        projectId: "mysavings-fcf4e",
        appId: "1:763144861093:web:98ce51b17501342298644c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
        else iniciarDashboard();
    });

    async function iniciarDashboard() {
        try {
            const response = await fetch('./backup (1).json');
            const data = await response.json();
            
            const labels = data.jars.map(j => j.name);
            const savings = data.jars.map(j => j.amountAllocated);
            const goals = data.jars.map(j => j.goalAmount);
            const colors = data.jars.map(j => j.jarTheme.split(';')[2]?.replace('ff', '#') || '#708090');

            renderPieChart(labels, savings, colors);
            renderBarChart(labels, savings, goals, colors);
            renderCards(data.jars, colors);

        } catch (e) { console.error("Error cargando datos:", e); }
    }

    function renderPieChart(labels, data, colors) {
        new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{ data: data, backgroundColor: colors }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }

    function renderBarChart(labels, savings, goals, colors) {
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Ahorrado', data: savings, backgroundColor: colors },
                    { label: 'Meta', data: goals, backgroundColor: '#e0e0e0' }
                ]
            },
            options: { 
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function renderCards(jars, colors) {
        const container = document.getElementById('jarsContainer');
        jars.forEach((jar, i) => {
            const perc = ((jar.amountAllocated / jar.goalAmount) * 100).toFixed(1);
            container.innerHTML += `
                <div class="jar-card" style="border-left-color: ${colors[i]}">
                    <strong>${jar.name}</strong>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${perc}%; background: ${colors[i]}"></div>
                    </div>
                    <small>${perc}% ($${jar.amountAllocated} / $${jar.goalAmount})</small>
                </div>
            `;
        });
    }

    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
