<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySavings Dashboard | Analizador Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- Sistema de Variables y Temas --- */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* --- Reseteo y Base --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding: 20px; 
            transition: var(--transition);
        }

        /* --- Layout Principal --- */
        .max-w-7xl { max-width: 1200px; margin: 0 auto; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
        
        .controls { display: flex; gap: 10px; }

        /* --- Botones --- */
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .btn-theme { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-theme:hover { border-color: var(--text-muted); }
        .btn-logout { background: var(--danger); color: white; }
        .btn-logout:hover { background: var(--danger-hover); }

        /* --- Resumen Superior --- */
        .summary-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-title { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .summary-value { font-size: 2rem; font-weight: 700; color: var(--accent); margin-top: 5px; }

        /* --- Gráficos --- */
        .charts-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .chart-container { 
            background: var(--bg-card); 
            padding: 24px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-color);
            position: relative;
            height: 350px; /* Altura fija para evitar saltos de layout */
        }
        .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: var(--text-main); }

        /* --- Tarjetas de Frascos --- */
        .jars-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        .jar-card { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: var(--radius); 
            border-left: 6px solid var(--border-color); 
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }
        .jar-card:hover { transform: translateY(-3px); }
        
        .jar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .jar-name { font-weight: 600; font-size: 1.05rem; }
        .jar-perc { font-weight: 700; color: var(--text-muted); font-size: 0.9rem; }
        
        .progress-bar { 
            height: 8px; 
            background: var(--border-color); 
            border-radius: 4px; 
            margin: 10px 0; 
            overflow: hidden; 
        }
        .progress-fill { height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .jar-details { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; }

        /* --- Estado de Carga --- */
        #loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; }
        
        /* Responsive */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; justify-content: space-between; }
            .summary-card { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="max-w-7xl">
    <div class="header">
        <h1>Dashboard MySavings</h1>
        <div class="controls">
            <button class="btn btn-theme" id="btnTheme">🌙 Oscuro</button>
            <button class="btn btn-logout" id="btnLogout">Cerrar Sesión</button>
        </div>
    </div>

    <div id="loading">Cargando datos de ahorros...</div>

    <div id="dashboardContent" style="display: none;">
        <div class="summary-card">
            <div>
                <div class="summary-title">Ahorro Total</div>
                <div class="summary-value" id="totalSaved">$0.00</div>
            </div>
            <div style="text-align: right;">
                <div class="summary-title">Meta Global</div>
                <div class="summary-value" style="color: var(--text-muted);" id="totalGoal">$0.00</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h2 class="section-title">Distribución de Fondos</h2>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-container">
                <h2 class="section-title">Progreso vs Meta</h2>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <h2 class="section-title" style="margin-top: 40px;">Detalle por Frascos</h2>
        <div class="jars-grid" id="jarsContainer"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAjvE0dar7x1bnj8xjy8KTgXwCFLVfUJ7Q",
        authDomain: "mysavings-fcf4e.firebaseapp.com",
        projectId: "mysavings-fcf4e",
        appId: "1:763144861093:web:98ce51b17501342298644c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Preferencia de Tema
    const themeBtn = document.getElementById('btnTheme');
    let isDark = localStorage.getItem('theme') === 'dark';
    
    function toggleTheme() {
        isDark = !isDark;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeBtn.textContent = isDark ? '☀️ Claro' : '🌙 Oscuro';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        // Actualizar colores de Chart.js dinámicamente si es necesario
        Chart.defaults.color = isDark ? '#9ca3af' : '#6b7280';
    }
    
    // Inicializar tema guardado
    if(isDark) toggleTheme(); else Chart.defaults.color = '#6b7280';
    themeBtn.addEventListener('click', toggleTheme);

    // Configuración global de Chart.js
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.maintainAspectRatio = false;

    onAuthStateChanged(auth, (user) => {
        // COMENTADO PARA PRUEBAS: Si no tienes login activo, comenta estas dos líneas
        // if (!user) window.location.href = "index.html"; 
        // else 
        iniciarDashboard();
    });

    async function iniciarDashboard() {
        try {
            const response = await fetch('./backup (1).json');
            if(!response.ok) throw new Error("No se pudo cargar el JSON");
            const data = await response.json();
            
            // Extracción y limpieza de datos
            const labels = data.jars.map(j => j.name);
            const savings = data.jars.map(j => parseFloat(j.amountAllocated) || 0);
            const goals = data.jars.map(j => parseFloat(j.goalAmount) || 0);
            
            // Extraer color de forma segura con fallback
            const colors = data.jars.map(j => {
                const themeData = j.jarTheme ? j.jarTheme.split(';') : [];
                return (themeData[2] && themeData[2].replace('ff', '#')) || '#4f46e5'; 
            });

            // Calcular Totales
            const totalS = savings.reduce((acc, curr) => acc + curr, 0);
            const totalG = goals.reduce((acc, curr) => acc + curr, 0);
            
            document.getElementById('totalSaved').textContent = `$${totalS.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            document.getElementById('totalGoal').textContent = `$${totalG.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

            // Ocultar loader y mostrar dashboard
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';

            renderPieChart(labels, savings, colors);
            renderBarChart(labels, savings, goals, colors);
            renderCards(data.jars, colors);

        } catch (e) { 
            console.error("Error cargando datos:", e);
            document.getElementById('loading').innerHTML = `<span style="color: var(--danger)">⚠️ Error al cargar los datos. Verifica que 'backup (1).json' exista.</span>`;
        }
    }

    function renderPieChart(labels, data, colors) {
        new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{ 
                    data: data, 
                    backgroundColor: colors,
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: { 
                plugins: { 
                    legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true } } 
                },
                cutout: '70%' // Hace la dona más delgada y elegante
            }
        });
    }

    function renderBarChart(labels, savings, goals, colors) {
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { 
                        label: 'Ahorrado', 
                        data: savings, 
                        backgroundColor: colors,
                        borderRadius: 6 // Bordes redondeados en barras
                    },
                    { 
                        label: 'Meta', 
                        data: goals, 
                        backgroundColor: isDark ? '#374151' : '#e5e7eb',
                        borderRadius: 6
                    }
                ]
            },
            options: { 
                scales: { 
                    y: { 
                        beginAtZero: true,
                        grid: { color: isDark ? '#374151' : '#f3f4f6' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: { legend: { position: 'top', align: 'end' } }
            }
        });
    }

    function renderCards(jars, colors) {
        const container = document.getElementById('jarsContainer');
        let htmlContent = ''; // Construir HTML en memoria para mayor rendimiento

        jars.forEach((jar, i) => {
            const amount = parseFloat(jar.amountAllocated) || 0;
            const goal = parseFloat(jar.goalAmount) || 0;
            let perc = goal > 0 ? ((amount / goal) * 100) : 0;
            if (perc > 100) perc = 100; // Evitar que la barra se salga del contenedor
            
            htmlContent += `
                <div class="jar-card" style="border-left-color: ${colors[i]}">
                    <div class="jar-header">
                        <span class="jar-name">${jar.name}</span>
                        <span class="jar-perc" style="color: ${colors[i]}">${perc.toFixed(1)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${perc}%; background: ${colors[i]}"></div>
                    </div>
                    <div class="jar-details">
                        <span>Ahorrado: <strong>$${amount.toLocaleString()}</strong></span>
                        <span>Meta: <strong>$${goal.toLocaleString()}</strong></span>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = htmlContent;
    }

    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
