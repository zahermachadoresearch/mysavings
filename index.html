<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MySavings</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #708090; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a6a7a; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>MySavings Login</h2>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="btnLogin">Entrar</button>
    <p id="error-msg" style="color: red; font-size: 0.8rem;"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAjvE0dar7x1bnj8xjy8KTgXwCFLVfUJ7Q",
        authDomain: "mysavings-fcf4e.firebaseapp.com",
        projectId: "mysavings-fcf4e",
        storageBucket: "mysavings-fcf4e.firebasestorage.app",
        messagingSenderId: "763144861093",
        appId: "1:763144861093:web:98ce51b17501342298644c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirigir si ya está logueado
    onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = "dashboard.html";
    });

    document.getElementById('btnLogin').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (error) {
            document.getElementById('error-msg').innerText = "Credenciales incorrectas";
        }
    });
</script>
</body>
</html>
